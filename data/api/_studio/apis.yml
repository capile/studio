---
all:
  title: "*APIs"
  model: Studio\Model\Apis
  actions:
    import:
      action: executeMethod
      position: 99
      identified: false
      batch: false
      query: true
      additional-params: true
  key: id
  #search:
  #  type: server
  options:
    list-parent: ~
    priority: 1060
    index: true
    group-by: id
    scope:
      uid:
        - id
      list:
        "*Title": title
        "*Indexed": indexed
        "*Indexed Records":
          bind: count(distinct `Index.id`) _index_count
          format: number
        "*Updated": updated
      preview:
        - scope::m
        - scope::s
      new:
        - scope::n
        - scope::s
      import:
        __default:
          fieldset: "*Connect to API"
          class: i1s2
        "*Schema Source URL":
          bind: schema_source
          format: url
          required: true
        "*API Type":
          bind: _schema_source_type
          choices:
            openapi: OpenAPI
            SCIM: SCIM
            swagger: Swagger
          format: select
          required: true
        "*ID Prefix": id
        "*Connection":
          bind: connection
          format: select
          choices: choicesConnection
      n:
        __default:
          type: text
          fieldset: API Definition
          class: i1s2
        "*Application":
          class: i1s4
          bind: app
        "*Base Endpoint":
          class: i1s4
          bind: listed
        "*ID": id
        "*Title": title
        "*Class Model": model
        "*Connection": connection
        "*Endpoint": source
        "*Indexing Interval": index_interval
      m:
        __default:
          type: text
          fieldset: API Definition
          class: i1s2
        "*Application":
          class: i1s4
          bind: app
        "*Base Endpoint":
          class: i1s4
          bind: listed
        "*ID": id
        "*Title": title
        "*Class Model": model
        "*Connection": connection
        "*Endpoint": source
        "*Indexing Interval": index_interval
      s:
        __default:
          type: text
          fieldset: Schema
        "*Source": schema_source
        "*Schema (overlay)":
          bind: schema_data
          format: textarea
          class: i1h10

